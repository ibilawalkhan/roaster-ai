# Supabase local config. `project_id` is the local stack identifier only;
# staging/production are linked separately via `supabase link`.
project_id = "rosterly"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = true
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

# Not used by Rosterly (no file uploads, no analytics). Disabling them drops the
# storage-api, imgproxy and vector containers — fewer images to pull locally.
[storage]
enabled = false

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Phone OTP is the primary staff login (REQUIREMENTS.md §4).
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.sms]
enable_signup = true
enable_confirmations = false

# A provider must be enabled or the CLI disables phone login. These are DUMMY
# local credentials — test-OTP numbers below short-circuit before Twilio is ever
# called, so no real SMS is sent and the token is never used. Real SMS is
# configured per-environment (staging/prod) via the dashboard, not here.
[auth.sms.twilio]
enabled = true
account_sid = "ACdummylocaldev0000000000000000000"
message_service_sid = "MGdummylocaldev0000000000000000000"
auth_token = "dummy-local-token-never-used"

[auth.sms.test_otp]
# Deterministic OTPs for local seeded phone numbers (no real SMS sent).
"61400000001" = "000000"
"61400000002" = "000000"
"61400000003" = "000000"
"61400000004" = "000000"
"61400000005" = "000000"
